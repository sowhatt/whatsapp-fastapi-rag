<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whatzabi Admin — Connexion</title>
  <link rel="stylesheet" href="/admin-web/admin.css">
  <link rel="stylesheet" href="/admin-web/tokens.css">
  <link rel="stylesheet" href="/admin-web/components.css">
</head>

<body class="login-page">

  <main class="login-shell">

    <section class="login-brand">
      <div class="brand-mark">W</div>

      <div>
        <h1>Whatzabi</h1>
        <p>Administration</p>
      </div>
    </section>

    <section class="login-card">

      <header>
        <h2>Connexion administrateur</h2>
        <p>
          Connectez-vous pour gérer les pilotes Whatzabi.
        </p>
      </header>

      <form id="admin-login-form">

        <label for="email">
          Adresse e-mail
        </label>

        <input
          id="email"
          name="email"
          type="email"
          autocomplete="username"
          required
          placeholder="admin@whatzabi.com"
        >

        <label for="password">
          Mot de passe
        </label>

        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
          placeholder="Votre mot de passe"
        >

        <div
          id="login-error"
          class="form-error"
          role="alert"
          hidden
        ></div>

        <button
          id="login-button"
          type="submit"
          class="primary-button"
        >
          Se connecter
        </button>

      </form>

    </section>

    <footer class="login-footer">
      Whatzabi Admin
    </footer>

  </main>

  <script src="/admin-web/admin.js"></script>

</body>
</html>
